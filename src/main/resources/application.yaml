logging:
  level:
    org.springframework.security: DEBUG

app:
  upload:
    dir: uploads/user-icons

spring:
  application:
    name: designer-tool

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000